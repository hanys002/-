# 기술사 채용공고 일일 수집 설정
# ---------------------------------------------------------------
# recency_days : 이 일수 이내 공고는 "최신"으로 본문 상단에 배치.
#                초과분은 리포트 하단 "참고(오래된 공고)" 섹션으로 이동.
# ---------------------------------------------------------------

recency_days: 183          # 약 6개월
max_items_per_source: 60
request_timeout: 25
request_delay: 1.2         # 소스별 요청 간 최소 간격(초) - 예의상 rate limit

keywords:

  # ── 1단계: 자격증명 직접 언급 → 무조건 채택 ───────────────────────
  # 타 분야 기술사가 함께 적힌 공고여도(예: "전기·정보통신기술사 모집")
  # 본인 자격을 찾는 공고이므로 버리지 않는다.
  primary:
    - 정보통신기술사
    - 산업계측제어기술사
    - 전자응용기술사
    - 정보공학기술사

  # ── 2단계: primary가 없을 때 role AND domain 이 모두 있어야 채택 ──
  # role만으로는 안 된다. 맨 '기술사'만 보고 채택하면 토목·건축·전기
  # 기술사 공고까지 들어온다(실제로 그렇게 됐다).
  role:
    - 기술사
    - 수석감리원
    - 특급감리원
    - 특급기술자
    - 감리원          # 정보통신기술사는 특급감리원 자격요건이라 실무상 직결
    - 감리단장

  # domain은 보유 3개 자격의 분야로만 한정한다.
  # '엔지니어링/설계/PM' 같은 범용어를 넣으면 전 분야가 통과하므로 금지.
  # role의 부분문자열도 넣지 말 것(예: '감리'는 '감리원'을 자기충족시킨다).
  domain:
    # 정보통신기술사 계열
    - 정보통신
    - 통신              # '통신 감리원 모집'처럼 한정어가 짧게만 붙는 공고가 많다
    - 방송통신
    - 통신설비
    - 통신망
    - 통신공사
    - 네트워크
    - 정보시스템
    # 산업계측제어기술사 계열
    - 계측
    - 제어
    - 계장
    - 계측제어
    - 산업계측
    - 자동제어
    # 전자응용기술사 계열
    - 전자
    - 전자응용
    - 전자설비
    - 전자회로

  # ── 3단계: 타 분야 기술사 → primary가 없을 때만 배제 ──────────────
  other_fields:
    - 건축기술사
    - 토목기술사
    - 전기기술사
    - 기계기술사
    - 소방기술사
    - 화공기술사
    - 조경기술사
    - 철도기술사
    - 상하수도기술사
    - 도로및공항기술사
    - 산업안전기술사
    - 산업위생관리기술사
    - 품질관리기술사
    - 건설안전기술사
    - 토질및기초기술사
    - 구조기술사
    - 가스기술사
    - 금속기술사
    - 조선기술사
    - 항공기술사

  # ── 채용이 아닌 글 → 어느 경우에나 즉시 탈락 ──────────────────────
  exclude:
    - 수강생
    - 수강료
    - 개강
    - 교재
    - 인강
    - 기출문제
    - 합격수기
    - 스터디원
    - 학원등록
    - 자격증대여      # 자격증 대여는 국가기술자격법 위반이라 원천 차단
    - 명의대여
    # 사이트 메뉴명. 글 번호 휴리스틱으로도 걸리지만 이중 방어.
    - 종합정보시스템

sources:

  - id: kpea
    name: 한국기술사회 구인정보
    org: 한국기술사회(KPEA)
    type: html_board
    url: https://www.kpea.or.kr/kpea/member/OfferList.do
    base: https://www.kpea.or.kr
    enabled: true
    # 게시판 목록 테이블. 선택자는 사이트 개편 시 여기만 고치면 됨.
    row_selector: "table tbody tr"
    title_selector: "a"
    date_selector: "td:nth-last-child(1), td:nth-last-child(2)"
    link_attr: href

  - id: itpe
    name: 한국정보통신기술사회 채용/구인
    org: 한국정보통신기술사회(ITPE)
    type: html_board
    url: https://www.itpe.or.kr/
    base: https://www.itpe.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span, em"
    link_attr: href

  - id: pesk
    name: 대한기술사회 구인구직
    org: 대한기술사회(PESK)
    type: html_board
    url: https://pesk.or.kr/?pg_idx=145
    base: https://pesk.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span"
    link_attr: href

  - id: kica
    name: 한국정보통신공사협회 채용정보
    org: 한국정보통신공사협회(KICA)
    type: html_board
    url: https://www.kica.or.kr/job/hireIndex
    base: https://www.kica.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li, div.list_item"
    title_selector: "a"
    date_selector: "td, span, .date"
    link_attr: href

  - id: etis
    name: 한국엔지니어링협회 ETIS 구인
    org: 한국엔지니어링협회(KENCA/ETIS)
    type: html_board
    url: https://www.etis.or.kr/jobGuinList.do
    base: https://www.etis.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span"
    link_attr: href

  - id: kacem
    name: 한국건설엔지니어링협회 구인
    org: 한국건설엔지니어링협회(KACEM)
    type: html_board
    url: http://www.ekacem.or.kr/openspace/job_offerring_li.asp
    base: http://www.ekacem.or.kr/openspace/
    enabled: true
    row_selector: "table tr"
    title_selector: "a"
    date_selector: "td"
    link_attr: href

  - id: saramin
    name: 사람인
    org: 사람인
    type: saramin
    enabled: true
    max_items: 20   # 포털은 검색 자체가 필터라 건수가 많다 — 최신순 상위만
    # SARAMIN_API_KEY 시크릿이 있으면 공식 오픈 API, 없으면 공개 검색 HTML 폴백
    api_url: https://oapi.saramin.co.kr/job-search
    search_url: https://www.saramin.co.kr/zf_user/search/recruit
    queries:
      - 정보통신기술사
      - 산업계측제어기술사
      - 전자응용기술사

  - id: jobkorea
    name: 잡코리아
    org: 잡코리아
    type: jobkorea
    enabled: true
    max_items: 20   # 포털은 검색 자체가 필터라 건수가 많다 — 최신순 상위만
    search_url: https://www.jobkorea.co.kr/Search/
    queries:
      - 정보통신기술사
      - 산업계측제어기술사
      - 전자응용기술사

  - id: work24
    name: 고용24(워크넷) 공공 API
    org: 고용노동부 고용24
    type: work24
    enabled: true
    max_items: 20   # 포털은 검색 자체가 필터라 건수가 많다 — 최신순 상위만
    # WORK24_API_KEY(공공데이터포털 인증키)가 있을 때만 동작
    api_url: https://apis.data.go.kr/1051000/recruitment/list
    queries:
      - 정보통신기술사
      - 산업계측제어기술사
      - 전자응용기술사
