# 기술사 채용공고 일일 수집 설정
# ---------------------------------------------------------------
# recency_days : 이 일수 이내 공고는 "최신"으로 본문 상단에 배치.
#                초과분은 리포트 하단 "참고(오래된 공고)" 섹션으로 이동.
# ---------------------------------------------------------------

recency_days: 365          # 1년. 초과분은 하단 '참고' 섹션으로
max_items_per_source: 100
request_timeout: 25
request_delay: 1.2         # 소스별 요청 간 최소 간격(초) - 예의상 rate limit

keywords:

  # ── 채택 기준: 아래 자격증명이 제목·본문에 직접 적혀 있을 것 ──────────
  #
  # 직무·등급 표현(감리원·선임자·초급/중급/고급/특급·기술자)은 쓰지 않는다.
  # 그 방식으로는 '정보통신감리원 모집'처럼 기술사를 요구하지 않는 자리가
  # 대량으로 걸린다. 자격증명이 적히지 않은 공고는 채택하지 않는다.
  #
  # normalize()가 공백·특수문자를 지우므로 아래 표기 하나로
  # '정보통신 기술사', '정보통신기술사', '[정보통신기술사]'가 모두 잡힌다.
  qualifications:
    - 정보통신기술사
    - 전자응용기술사
    - 산업계측제어기술사

  # ── 게시판 목록 전용: 제목에 아래 중 하나가 있어야 공고로 본다 ────────
  # 협회 사이트를 통째로 훑으면 카테고리 메뉴와 뉴스 기사도 함께 걸린다.
  # ('정보통신기술사 합격자 발표' 같은 글은 자격증명이 있어도 채용이 아니다)
  hiring_signals:
    - 모집
    - 채용
    - 구인
    - 구합
    - 모십
    - 충원
    - 초빙
    - 영입
    - 구해
    - 찾습니다
    - 공고

  # ── 채용이 아닌 글·끝난 공고 → 즉시 탈락 ──────────────────────────
  exclude:
    # 학원·교재 광고
    - 수강생
    - 수강료
    - 개강
    - 교재
    - 인강
    - 기출문제
    - 합격수기
    - 스터디원
    - 학원등록
    # 자격증 대여는 국가기술자격법 위반이라 원천 차단
    - 자격증대여
    - 명의대여
    # 사이트 메뉴명
    - 종합정보시스템
    # 이미 끝난 공고 — 지원할 수 없으니 메일에 올리지 않는다.
    # normalize가 공백을 지우므로 '구인 완료'도 '구인완료'로 걸린다.
    - 구인완료
    - 모집완료
    - 채용완료
    - 마감되었습니다
    - 마감완료
    - 모집하였습니다
    - 구인하였습니다
    - 채용하였습니다

# 포털·API에 던질 검색어. 자격증명 그대로 쓴다.
# 이건 '어디를 볼지'를 정할 뿐이고, 채택 여부는 keywords.qualifications가 정한다.
qualification_queries: &qualification_queries
  - 정보통신기술사
  - 산업계측제어기술사
  - 전자응용기술사

sources:

  - id: kpea
    name: 한국기술사회 구인정보
    org: 한국기술사회(KPEA)
    type: row_board
    url: https://www.kpea.or.kr/kpea/member/OfferList.do
    base: https://www.kpea.or.kr
    enabled: true
    # 일반 게시판이 아니라 표다. 제목 컬럼이 없고 셀에 정보가 나뉘어 있다.
    #   번호 | 구분 | 모집 자격종목 | 회사 | 지역 | 마감일 | 등록일 | 조회
    # 진단(--diagnose kpea)으로 확인한 실제 구조. 로그인은 필요 없다.
    row_selector: "table tbody tr"
    min_cells: 6
    columns:
      qualification: 2
      company: 3
      location: 4
      deadline: 5
      posted: 6

  - id: itpe
    name: 한국정보통신기술사회 채용/구인
    org: 한국정보통신기술사회(ITPE)
    type: html_board
    url: https://www.itpe.or.kr/
    base: https://www.itpe.or.kr
    enabled: true
    login:
      url: https://www.itpe.or.kr/member/loginProc
      id_field: userId
      pw_field: userPw
      id_env: ITPE_ID
      pw_env: ITPE_PW
      success_marker: 로그아웃
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span, em"
    link_attr: href

  - id: pesk
    name: 대한기술사회 구인구직
    org: 대한기술사회(PESK)
    type: html_board
    url: https://pesk.or.kr/?pg_idx=145
    base: https://pesk.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span"
    link_attr: href

  - id: kica
    name: 한국정보통신공사협회 채용정보
    org: 한국정보통신공사협회(KICA)
    type: html_board
    url: https://www.kica.or.kr/job/hireIndex
    base: https://www.kica.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li, div.list_item"
    title_selector: "a"
    date_selector: "td, span, .date"
    link_attr: href

  - id: etis
    name: 한국엔지니어링협회 ETIS 구인
    org: 한국엔지니어링협회(KENCA/ETIS)
    type: html_board
    url: https://www.etis.or.kr/jobGuinList.do
    base: https://www.etis.or.kr
    enabled: true
    row_selector: "table tbody tr, ul li"
    title_selector: "a"
    date_selector: "td, span"
    link_attr: href

  - id: kacem
    name: 한국건설엔지니어링협회 구인
    org: 한국건설엔지니어링협회(KACEM)
    type: html_board
    url: http://www.ekacem.or.kr/openspace/job_offerring_li.asp
    base: http://www.ekacem.or.kr/openspace/
    enabled: true
    row_selector: "table tr"
    title_selector: "a"
    date_selector: "td"
    link_attr: href

  - id: gamli
    name: 정보통신감리협회 구인
    org: 한국정보통신감리협회
    type: html_board
    # 정보통신 감리원·기술사 구인이 집중되는 게시판. 범용 포털보다 적중률이 높다.
    url: http://www.gamli.or.kr/base/work/work_01.php?topmenu=5
    base: http://www.gamli.or.kr/base/work/
    enabled: true
    # 비회원은 상세 열람이 막혀 있다(href가 javascript:alert). 로그인하면
    # 상세 링크가 살아나 메일에서 바로 열 수 있다.
    login:
      url: http://www.gamli.or.kr/base/login/login_ok.php
      id_field: id
      pw_field: pw
      id_env: GAMLI_ID
      pw_env: GAMLI_PW
      success_marker: 로그아웃
    row_selector: "table tbody tr, table tr"
    title_selector: "a"
    date_selector: "td"
    link_attr: href

  - id: kapie
    name: 한국정보공학기술사회 구인
    org: 한국정보공학기술사회(KAPIE)
    type: html_board
    url: https://kapie.or.kr/
    base: https://kapie.or.kr/
    enabled: true
    row_selector: "article, .post, ul li"
    title_selector: "a"
    date_selector: "time, .date, span"
    link_attr: href

  # ── 채용포털 (type: portal_search) ───────────────────────────────
  # 포털 검색은 필터가 아니다. 일치 건이 적으면 무관 공고로 결과를 채우므로
  # 채택 여부는 자격증명 매칭으로만 결정한다. queries는 '어디를 볼지'일 뿐.

  - id: saramin
    name: 사람인
    org: 사람인
    type: portal_search
    enabled: true
    search_url: https://www.saramin.co.kr/zf_user/search/recruit
    base: https://www.saramin.co.kr
    query_param: searchword
    extra_params:
      recruitSort: reg_dt
      recruitPageCount: 40
    detail_hints: ["rec_idx="]
    max_items: 20
    # 자격증명은 제목이 아니라 상세의 우대사항에 적힌다. 목록에서 못 찾으면
    # 상세를 열어 확인한다. 실측: 계측제어 직종 337건 중 제목 명시 0건.
    verify_detail: true
    max_detail_fetch: 25
    queries: *qualification_queries

  - id: jobkorea
    name: 잡코리아
    org: 잡코리아
    type: portal_search
    enabled: true
    search_url: https://www.jobkorea.co.kr/Search/
    base: https://www.jobkorea.co.kr
    query_param: stext
    extra_params:
      tabType: recruit
    detail_hints: ["/Recruit/GI_Read"]
    max_items: 20
    # 자격증명은 제목이 아니라 상세의 우대사항에 적힌다. 목록에서 못 찾으면
    # 상세를 열어 확인한다. 실측: 계측제어 직종 337건 중 제목 명시 0건.
    verify_detail: true
    max_detail_fetch: 25
    queries: *qualification_queries

  - id: incruit
    name: 인크루트
    org: 인크루트
    type: portal_search
    # 인크루트는 자격증 기준 색인을 제공해 기술사급 공고 적중률이 높다.
    enabled: true
    search_url: https://job.incruit.com/jobdb_list/searchjob.asp
    base: https://job.incruit.com
    query_param: kw
    detail_hints: ["/jobdb_info/jobpost.asp", "/entrjob/"]
    max_items: 20
    # 자격증명은 제목이 아니라 상세의 우대사항에 적힌다. 목록에서 못 찾으면
    # 상세를 열어 확인한다. 실측: 계측제어 직종 337건 중 제목 명시 0건.
    verify_detail: true
    max_detail_fetch: 25
    queries: *qualification_queries

  # ── 플랜트·계장·전자 분야 (산업계측제어·전자응용기술사 대응) ────────
  # 감리협회는 정보통신 전용이라 이 두 자격이 올라오지 않는다.
  # 아래는 해당 분야 공고가 실제로 게시되는 곳들.

  # 직종 카테고리 목록은 제목만 보이고 상세 확인 없이는 자격증명을 알 수 없다.
  # 수백 건을 모두 열 수는 없으므로 비활성화한다. 같은 공고는 위 포털 검색이
  # 본문 색인으로 찾아내고 verify_detail로 확인하므로 누락되지 않는다.
  - id: saramin_control
    name: 사람인 계측제어 직종
    org: 사람인(계측제어)
    type: html_board
    # 키워드 검색이 아니라 직종 카테고리 목록. 플랜트 계장·제어 공고가 모인다.
    url: https://www.saramin.co.kr/zf_user/jobs/list/job-category?cat_kewd=1125
    base: https://www.saramin.co.kr
    enabled: false
    row_selector: ".item_recruit, .list_item"
    title_selector: "a"
    date_selector: ".job_date, .date"
    link_attr: href

  - id: saramin_electronics
    name: 사람인 전자·반도체 직종
    org: 사람인(전자)
    type: html_board
    url: https://www.saramin.co.kr/zf_user/jobs/list/job-category?cat_kewd=1260
    base: https://www.saramin.co.kr
    enabled: false
    row_selector: ".item_recruit, .list_item"
    title_selector: "a"
    date_selector: ".job_date, .date"
    link_attr: href

  - id: kopia
    name: 한국플랜트산업협회
    org: 한국플랜트산업협회(KOPIA)
    type: html_board
    url: https://www.kopia.or.kr/business/professional.php
    base: https://www.kopia.or.kr/business/
    enabled: true
    row_selector: "table tbody tr, table tr, ul li"
    title_selector: "a"
    date_selector: "td, span, .date"
    link_attr: href

  # ── 공공 (전 산업 포괄 — 두 자격 대응에 가장 유효) ──────────────────
  - id: work24
    name: 워크넷 채용정보 공공 API
    org: 고용노동부 워크넷
    type: work24
    enabled: true
    # WORK24_API_KEY(워크넷 오픈API 인증키)가 있을 때만 동작.
    # 전 산업·전 지역을 포괄해 플랜트·계장 공고까지 들어온다.
    # 발급: https://www.data.go.kr/data/3038225/openapi.do
    api_url: https://openapi.work.go.kr/opi/opi/opiService/wantedApi.do
    max_items: 30
    queries: *qualification_queries
