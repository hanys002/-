name: 기술사 채용공고 데일리 메일

# 실행은 Routine이 매일 00:00 UTC(=09:00 KST)에 workflow_dispatch로 건다.
#
# GitHub 예약 실행(cron)을 쓰다가 걷어냈다. 실측 2일치가 일관되게 밀렸다.
#
#   09-16  cron 00:00:00Z 예정 → 실제 04:29:07Z  (4시간 29분)
#   09-17  cron 00:00:00Z 예정 → 실제 04:35:02Z  (4시간 35분)
#
# 편차가 6분뿐이라 혼잡에 따른 무작위 지연이 아니라 배정된 슬롯으로 보인다.
# cron 시각을 옮겨 피할 수 있는 성질이 아니다. 같은 기간 Routine은 예정
# 시각 대비 최대 47초 안에 발화했다. 방아쇠를 Routine으로 옮긴 이유다.
#
# cron을 백업으로 남기면 하루 2통이 되므로(두 번째도 전체 목록) 제거한다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '메일 발송 없이 리포트만 생성'
        type: boolean
        default: false
      diagnose:
        description: "소스 진단 (소스 id, 쉼표 구분, 또는 all)"
        type: string
        default: ''
      probe:
        description: "임의 URL 진단 (쉼표 구분)"
        type: string
        default: ''
      render:
        description: "probe를 브라우저로 렌더링 (JS 메뉴·AJAX 게시판)"
        type: boolean
        default: false
      eval_js:
        description: "렌더링 후 실행할 JS. 예: menu('sub7_1')"
        type: string
        default: ''

permissions:
  contents: write        # state/seen.json 커밋용

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브라우저 설치
        # JS 메뉴(정보통신기술사회)·AJAX 목록(대한기술사회)은 렌더링해야 읽힌다.
        run: python -m playwright install --with-deps chromium

      - name: 파이프라인 테스트
        run: python tests/test_pipeline.py

      - name: 수집 및 발송
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO || secrets.GMAIL_USER }}
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          # 협회 게시판 로그인 (회원 전용 게시판 열람용)
          KPEA_ID: ${{ secrets.KPEA_ID }}
          KPEA_PW: ${{ secrets.KPEA_PW }}
          ITPE_ID: ${{ secrets.ITPE_ID }}
          ITPE_PW: ${{ secrets.ITPE_PW }}
          GAMLI_ID: ${{ secrets.GAMLI_ID }}
          GAMLI_PW: ${{ secrets.GAMLI_PW }}
        run: |
          if [ -n "${{ inputs.probe }}" ]; then
            python -m src.main --probe "${{ inputs.probe }}" \
              ${{ inputs.render && '--render' || '' }} \
              ${{ inputs.eval_js && format('--eval-js "{0}"', inputs.eval_js) || '' }}
          elif [ -n "${{ inputs.diagnose }}" ]; then
            python -m src.main --diagnose "${{ inputs.diagnose }}"
          else
            python -m src.main ${{ inputs.dry_run && '--dry-run' || '' }}
          fi

      - name: 리포트 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/digest.html
          retention-days: 14
          if-no-files-found: warn

      - name: 조회 이력 커밋
        if: success() && !inputs.dry_run && !inputs.diagnose && !inputs.probe
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(state): 조회 이력 갱신 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
